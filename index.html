<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b53"><meta name="mobile-web-app-capable" content="yes"><title>TEMPERATURE LITMERK</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17263b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b53;color:white;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(20px,4vw,31px);margin:0;letter-spacing:.05em}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #b4c3d4;background:white;border-radius:9px;padding:9px 12px;color:#17263b}button.primary{background:#2067b1;color:white;border-color:#2067b1}button:disabled{opacity:.45}#authbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status{font-size:13px;color:#526579}.headstatus{color:#dbe7ff}main{max-width:1700px;margin:auto;padding:12px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white;border:1px solid #dae2ec;padding:10px;border-radius:12px;margin-bottom:12px}.controls label{font-weight:700}select,input{border:1px solid #b4c3d4;border-radius:8px;padding:9px;background:white}#year,#month{min-width:100px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}.panel{background:white;border:1px solid #dae2ec;border-radius:12px;padding:12px;min-width:0}.graphPanel{display:flex;flex-direction:column;gap:10px}.chartBox{height:min(62vh,630px);min-height:340px;position:relative}canvas{width:100%;height:100%;touch-action:pan-y;display:block}h2{margin:0 0 12px;font-size:19px}.sensor{padding:11px 0;border-bottom:1px solid #e3eaf1}.sensor:last-child{border:0}.sensor strong{display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:16px;font-weight:700}.stat small{display:block;font-weight:400;color:#617188;font-size:12px;margin-top:3px}.dayPanel{background:#eef5fc;border-radius:9px;padding:10px;min-height:70px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#526579}.line{display:inline-block;width:26px;border-top:3px solid;vertical-align:middle;margin-right:4px}.navday{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.navday input{flex:1;min-width:90px}.error{color:#a11925}.settings{margin-top:12px}.settings summary{cursor:pointer;font-weight:700}.settings input{width:min(100%,480px);margin:8px 0}.hint{font-size:13px;color:#53657a;line-height:1.5}.empty{padding:30px;text-align:center;color:#5c6c81}a{color:#0e63a8}#busy{font-size:13px;color:#586d85}
@media(max-width:860px){.layout{grid-template-columns:1fr}.chartBox{height:47vh;min-height:280px}.sensor{display:inline-block;vertical-align:top;width:49%;padding-right:12px}.panel{padding:10px}header{padding:12px}main{padding:8px}.controls{gap:8px}.controls select{min-width:90px}}@media(max-width:430px){.sensor{width:100%}.chartBox{height:42vh;min-height:255px}.stat{font-size:15px}h1{font-size:21px}}@media(orientation:landscape) and (max-height:550px){.chartBox{height:64vh;min-height:220px}}
</style></head><body>
<header><h1>TEMPERATURE&nbsp;&nbsp;&nbsp;LITMERK</h1><div id="authbar"><span class="status headstatus">Podatki: GitHub</span></div></header>
<main><div class="controls"><label for="year">Leto</label><select id="year" disabled></select><label for="month">Mesec</label><select id="month" disabled></select><span id="busy">Nalagam podatke ...</span></div>
<div class="layout"><section class="panel graphPanel"><div class="chartBox"><canvas id="chart" aria-label="Graf temperatur"></canvas></div><div class="navday"><button id="prev" aria-label="Prejšnji dan">◀</button><input id="day" type="range" min="1" max="31" value="1" aria-label="Izbrani dan"><button id="next" aria-label="Naslednji dan">▶</button></div><div id="dayInfo" class="dayPanel">Izberi mesec za prikaz.</div><div class="legend"><span><i class="line" style="border-color:#4169e1"></i>Ts (soba)</span><span><i class="line" style="border-color:#dc143c"></i>Tz (zunanja)</span><span><i class="line" style="border-color:#228b22"></i>Tm (mansarda)</span><span><i class="line" style="border-color:#9400d3"></i>Tg (garaža)</span><span><i class="line" style="border-color:#ff8c00"></i>Twc (sanitarije)</span><span>Črtkano = MIN, polno = MAX</span></div></section><aside class="panel"><h2 id="statsTitle">MIN / MAX – MESEC</h2><div id="stats" class="empty">Ni podatkov</div></aside></div>
</main>
<script src="app.js?v=2"></script></body></html>
